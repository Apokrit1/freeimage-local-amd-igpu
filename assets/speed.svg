<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; } .m { fill: #59636e; } .bar { fill: #c8ccd1; } .win { fill: #1f2328; } .grid { stroke: #d1d9e0; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; } .m { fill: #9198a1; } .bar { fill: #3d444d; } .win { fill: #f0f6fc; } .grid { stroke: #3d444d; }
    }
  </style>
  <text x="0" y="22" class="t" font-size="17" font-weight="600">Seconds to sample one 1024×1024 image, 8 steps</text>
  <text x="0" y="44" class="m" font-size="13">RTX 3060 Laptop, 6 GB VRAM, 60–65 W · stable-diffusion.cpp · lower is better</text>

  <line x1="250" y1="62" x2="250" y2="270" class="grid"/>

  <text x="0" y="92" class="t" font-size="14">GGUF Q5_K_M</text>
  <rect x="250" y="76" width="448" height="24" rx="6" class="bar"/>
  <text x="706" y="93" class="m" font-size="14">28.0 s</text>

  <text x="0" y="140" class="t" font-size="14">GGUF Q8_0</text>
  <rect x="250" y="124" width="408" height="24" rx="6" class="bar"/>
  <text x="666" y="141" class="m" font-size="14">25.5 s</text>

  <text x="0" y="188" class="t" font-size="14">int8_convrot</text>
  <rect x="250" y="172" width="253" height="24" rx="6" class="bar"/>
  <text x="511" y="189" class="m" font-size="14">15.8 s</text>

  <text x="0" y="236" class="t" font-size="14" font-weight="600">int8_convrot + SageAttention</text>
  <rect x="250" y="220" width="246" height="24" rx="6" class="win"/>
  <text x="504" y="237" class="t" font-size="14" font-weight="600">15.4 s  ·  40% faster than Q8</text>

  <text x="0" y="290" class="m" font-size="12">Midpoints of measured ranges (Q5 27–29, Q8 24–27, int8 15–16.5, int8 + Sage 14.4–16.3 s).</text>
</svg>
